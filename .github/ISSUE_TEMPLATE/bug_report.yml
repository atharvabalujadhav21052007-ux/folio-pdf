name: 🐛 Bug Report
description: File a bug report for Folio PDF editor
title: "[BUG]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What went wrong?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser & OS
      description: e.g. Chrome 124 on macOS / Windows
    validations:
      required: true
